name: Deploy Pages

run-name: Deploy Pages / ${{ (github.event_name == 'workflow_dispatch' && inputs.deployment_mode) || 'adopt' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      consumer_revision:
        description: Optional full consumer commit SHA (rollback only; adopt uses the workflow revision)
        required: false
        default: ''
        type: string
      deployment_mode:
        description: Forward catalogue adoption or rollback to a previous known-good revision
        required: true
        default: adopt
        type: choice
        options:
          - adopt
          - rollback
      bootstrap:
        description: Explicitly authorize first publication when no production manifest exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-${{ (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'rollback' && 'rollback') || 'adopt' }}
  cancel-in-progress: false

jobs:
  deployment-lane:
    name: reserve deployment lane
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    outputs:
      proceed: ${{ steps.lane.outputs.proceed }}
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Protect rollback priority
        id: lane
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'adopt' }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/deployment-boundaries.mjs lane
      - name: Trigger independent catalogue intake
        if: steps.lane.outputs.proceed == 'true' && (github.event_name == 'push' || inputs.deployment_mode == 'adopt')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalogue-release.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    name: deploy
    needs: deployment-lane
    if: needs.deployment-lane.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SNOREDEX_APP_REVISION: ${{ github.sha }}
      SNOREDEX_PUBLICATION_ID: pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up workflow Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Resolve deployment inputs
        id: deployment-inputs
        env:
          DEPLOYMENT_MODE_INPUT: ${{ inputs.deployment_mode }}
          CONSUMER_REVISION_INPUT: ${{ inputs.consumer_revision }}
          BOOTSTRAP_INPUT: ${{ inputs.bootstrap }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          node scripts/deployment-boundaries.mjs inputs
      - name: Validate consumer revision
        env:
          CONSUMER_REVISION: ${{ steps.deployment-inputs.outputs.consumer_revision }}
        run: |
          if [[ ! "$CONSUMER_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "consumer_revision must be a full lowercase commit SHA"
            exit 1
          fi
          git cat-file -e "$CONSUMER_REVISION^{commit}"
      - name: Preserve current adoption guard
        env:
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          git show "$WORKFLOW_REVISION:scripts/check-production-adoption.mjs" > "$RUNNER_TEMP/check-production-adoption.mjs"
          git show "$WORKFLOW_REVISION:scripts/deployment-boundaries.mjs" > "$RUNNER_TEMP/deployment-boundaries.mjs"
          git show "$WORKFLOW_REVISION:scripts/browser-gates.mjs" > "$RUNNER_TEMP/browser-gates.mjs"
      - name: Check out consumer revision
        env:
          CONSUMER_REVISION: ${{ steps.deployment-inputs.outputs.consumer_revision }}
        run: git checkout --detach "$CONSUMER_REVISION"
      - name: Validate deployment tooling
        run: |
          for path in scripts/check-production-adoption.mjs scripts/create-deployment-manifest.mjs scripts/smoke-pages.mjs; do
            if [[ ! -f "$path" ]]; then
              echo "consumer_revision lacks required deployment tooling: $path"
              exit 1
            fi
          done
          for script in check test:browser test:accessibility deployment:manifest artifact:check smoke:pages; do
            if ! grep -q "\"$script\"" package.json; then
              echo "consumer_revision lacks required npm script: $script"
              exit 1
            fi
          done
          if [[ "${{ steps.deployment-inputs.outputs.deployment_mode }}" == "adopt" ]] && ! grep -q "SNOREDEX_CURRENT_DEPLOYMENT_PATH" scripts/check-production-adoption.mjs; then
            echo "consumer_revision lacks the published deployment adoption guard"
            exit 1
          fi
          if [[ "${{ steps.deployment-inputs.outputs.deployment_mode }}" == "rollback" ]] && ! grep -q "SNOREDEX_CURRENT_DEPLOYMENT_PATH" scripts/create-deployment-manifest.mjs; then
            echo "consumer_revision lacks recoverable deployment provenance"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install supported Playwright engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run repository gates
        run: npm run check
      - name: Read current production catalogue fingerprint
        id: current-production
        env:
          SNOREDEX_PAGE_URL: https://m4s-ai.github.io/snoredex-checklist/
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/current-deployment.json"
          provenance="$RUNNER_TEMP/current-provenance.json"
          module_manifest="$RUNNER_TEMP/current-module-manifest.json"
          rm -f "$manifest"
          rm -f "$provenance"
          rm -f "$module_manifest"
          set +e
          status="$(curl --silent --show-error --location --output "$manifest" --write-out '%{http_code}' "$SNOREDEX_PAGE_URL/deployment.json")"
          curl_status=$?
          set -e
          if [[ "$curl_status" -ne 0 ]]; then
            echo "current production deployment unavailable (transport failure)"
            exit 1
          fi
          if [[ "$status" == "404" ]]; then
            set +e
            provenance_status="$(curl --silent --show-error --location --output "$provenance" --write-out '%{http_code}' "$SNOREDEX_PAGE_URL/provenance.json")"
            provenance_curl_status=$?
            module_manifest_status="$(curl --silent --show-error --location --output "$module_manifest" --write-out '%{http_code}' "$SNOREDEX_PAGE_URL/assets/module-manifest.json")"
            module_manifest_curl_status=$?
            set -e
            if [[ "$provenance_curl_status" -ne 0 || "$module_manifest_curl_status" -ne 0 ]]; then
              echo "current production provenance unavailable (transport failure)"
              exit 1
            elif [[ "$provenance_status" == "404" && "$module_manifest_status" == "404" ]]; then
              rm -f "$provenance" "$module_manifest"
              echo "catalogue_fingerprint=" >> "$GITHUB_OUTPUT"
              echo "app_revision=" >> "$GITHUB_OUTPUT"
              echo "manifest_path=" >> "$GITHUB_OUTPUT"
              echo "provenance_path=" >> "$GITHUB_OUTPUT"
              echo "state=missing" >> "$GITHUB_OUTPUT"
            elif [[ "$provenance_status" == "200" || "$module_manifest_status" == "200" ]]; then
              echo "current production publication evidence exists despite a missing deployment manifest"
              exit 1
            else
              echo "current production provenance unavailable (HTTP $provenance_status)"
              exit 1
            fi
          elif [[ "$status" == "200" ]]; then
            set +e
            provenance_status="$(curl --silent --show-error --location --output "$provenance" --write-out '%{http_code}' "$SNOREDEX_PAGE_URL/provenance.json")"
            provenance_curl_status=$?
            module_manifest_status="$(curl --silent --show-error --location --output "$module_manifest" --write-out '%{http_code}' "$SNOREDEX_PAGE_URL/assets/module-manifest.json")"
            module_manifest_curl_status=$?
            set -e
            if [[ "$provenance_curl_status" -ne 0 || "$module_manifest_curl_status" -ne 0 || "$provenance_status" != "200" || "$module_manifest_status" != "200" ]]; then
              echo "current production provenance unavailable (HTTP $provenance_status)"
              exit 1
            fi
            CURRENT_DEPLOYMENT_PATH="$manifest" node "$RUNNER_TEMP/deployment-boundaries.mjs" production
            echo "manifest_path=$manifest" >> "$GITHUB_OUTPUT"
            echo "provenance_path=$provenance" >> "$GITHUB_OUTPUT"
            echo "module_manifest_path=$module_manifest" >> "$GITHUB_OUTPUT"
            echo "state=present" >> "$GITHUB_OUTPUT"
          else
            echo "current production deployment manifest unavailable (HTTP $status)"
            exit 1
          fi
      - name: Validate rollback target
        if: steps.deployment-inputs.outputs.deployment_mode == 'rollback'
        env:
          CONSUMER_REVISION: ${{ steps.deployment-inputs.outputs.consumer_revision }}
          CURRENT_DEPLOYMENT_PATH: ${{ steps.current-production.outputs.manifest_path }}
        run: |
          node "$RUNNER_TEMP/deployment-boundaries.mjs" rollback
      - name: Require reviewed producer migration target
        if: steps.deployment-inputs.outputs.deployment_mode == 'adopt' || steps.deployment-inputs.outputs.deployment_mode == 'rollback'
        env:
          SNOREDEX_DEPLOYMENT_MODE: ${{ steps.deployment-inputs.outputs.deployment_mode }}
          SNOREDEX_CURRENT_DEPLOYMENT_PATH: ${{ steps.current-production.outputs.manifest_path }}
          SNOREDEX_CURRENT_PROVENANCE_PATH: ${{ steps.current-production.outputs.provenance_path }}
          SNOREDEX_CURRENT_MODULE_MANIFEST_PATH: ${{ steps.current-production.outputs.module_manifest_path }}
          SNOREDEX_BOOTSTRAP_AUTHORIZED: ${{ steps.deployment-inputs.outputs.bootstrap_authorized }}
          SNOREDEX_REPOSITORY_ROOT: ${{ github.workspace }}
        run: node "$RUNNER_TEMP/check-production-adoption.mjs"
      - name: Run browser and accessibility gates
        run: node "$RUNNER_TEMP/browser-gates.mjs"
      - name: Retain revision-coherent runtime assets
        env:
          SNOREDEX_PAGE_URL: https://m4s-ai.github.io/snoredex-checklist/
          SNOREDEX_CURRENT_DEPLOYMENT_PATH: ${{ steps.current-production.outputs.manifest_path }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$WORKFLOW_REVISION" ]]; then
            git checkout --detach "$WORKFLOW_REVISION"
            npm ci
          fi
          node scripts/retain-runtime-assets.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Add deployment provenance
        env:
          SNOREDEX_PAGE_URL: https://m4s-ai.github.io/snoredex-checklist/
          SNOREDEX_CURRENT_DEPLOYMENT_PATH: ${{ steps.current-production.outputs.manifest_path }}
        run: npm run deployment:manifest
      - name: Recheck published artifact
        run: npm run artifact:check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Smoke-test deployed Pages site
        env:
          SNOREDEX_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SNOREDEX_EXPECTED_GITHUB_SHA: ${{ steps.deployment-inputs.outputs.consumer_revision }}
        run: node scripts/deployment-boundaries.mjs smoke
