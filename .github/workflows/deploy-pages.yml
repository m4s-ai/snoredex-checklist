name: Deploy Pages

run-name: Deploy Pages / ${{ (github.event_name == 'workflow_dispatch' && inputs.deployment_mode) || 'adopt' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      consumer_revision:
        description: Optional full consumer commit SHA (rollback only; adopt uses the workflow revision)
        required: false
        default: ''
        type: string
      deployment_mode:
        description: Forward catalogue adoption or rollback to a previous known-good revision
        required: true
        default: adopt
        type: choice
        options:
          - adopt
          - rollback

permissions:
  contents: read

concurrency:
  group: pages-${{ (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'rollback' && 'rollback') || 'adopt' }}
  cancel-in-progress: false

jobs:
  deployment-lane:
    name: reserve deployment lane
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    outputs:
      proceed: ${{ steps.lane.outputs.proceed }}
    steps:
      - name: Protect rollback priority
        id: lane
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'adopt' }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export DEPLOYMENT_MODE CURRENT_RUN_ID REPOSITORY
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const mode = process.env.DEPLOYMENT_MODE;
          const currentRunId = String(process.env.CURRENT_RUN_ID);
          const repository = process.env.REPOSITORY;
          const readRuns = () => {
            const response = execFileSync(
              'gh',
              [
                'api',
                '--paginate',
                '--slurp',
                `repos/${repository}/actions/workflows/deploy-pages.yml/runs?per_page=100`,
              ],
              { encoding: 'utf8' },
            );
            return JSON.parse(response).flatMap((page) => page.workflow_runs ?? []);
          };

          const activeStatuses = new Set(['queued', 'in_progress', 'waiting', 'pending']);
          const currentRuns = () => readRuns().filter((run) => String(run.id) !== currentRunId && activeStatuses.has(run.status));
          const isRollbackRun = (run) => run.event === 'workflow_dispatch' && /\/ rollback$/u.test(run.display_title ?? '');
          const runs = currentRuns();
          const rollbackRuns = runs.filter(isRollbackRun);
          let proceed = true;

          if (mode === 'adopt') {
            proceed = rollbackRuns.length === 0;
            if (!proceed) console.log('automatic adoption deferred while a rollback run is queued or active');
          } else if (mode === 'rollback') {
            const activeRuns = runs.filter((run) => !isRollbackRun(run));
            const deadline = Date.now() + 30 * 60 * 1000;
            while (activeRuns.length > 0 && Date.now() < deadline) {
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 15000);
              activeRuns.splice(
                0,
                activeRuns.length,
                ...currentRuns().filter((run) => !isRollbackRun(run)),
              );
            }
            if (activeRuns.length > 0) throw new Error('rollback could not acquire the deployment lane');
          } else {
            throw new Error('invalid deployment mode');
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `proceed=${proceed}\n`);
          NODE
      - name: Trigger independent catalogue intake
        if: steps.lane.outputs.proceed == 'true' && (github.event_name == 'push' || inputs.deployment_mode == 'adopt')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalogue-release.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    name: deploy
    needs: deployment-lane
    if: needs.deployment-lane.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SNOREDEX_APP_REVISION: ${{ github.sha }}
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve deployment inputs
        id: deployment-inputs
        env:
          DEPLOYMENT_MODE_INPUT: ${{ inputs.deployment_mode }}
          CONSUMER_REVISION_INPUT: ${{ inputs.consumer_revision }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployment_mode="${DEPLOYMENT_MODE_INPUT:-adopt}"
          if [[ "$deployment_mode" == "rollback" && -z "$CONSUMER_REVISION_INPUT" ]]; then
            echo "consumer_revision is required for rollback"
            exit 1
          fi
          consumer_revision="${CONSUMER_REVISION_INPUT:-$WORKFLOW_REVISION}"
          if [[ ! "$consumer_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "consumer_revision must resolve to a full lowercase commit SHA"
            exit 1
          fi
          echo "deployment_mode=$deployment_mode" >> "$GITHUB_OUTPUT"
          echo "consumer_revision=$consumer_revision" >> "$GITHUB_OUTPUT"
          echo "SNOREDEX_APP_REVISION=$consumer_revision" >> "$GITHUB_ENV"
      - name: Validate consumer revision
        env:
          CONSUMER_REVISION: ${{ steps.deployment-inputs.outputs.consumer_revision }}
        run: |
          if [[ ! "$CONSUMER_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "consumer_revision must be a full lowercase commit SHA"
            exit 1
          fi
          git cat-file -e "$CONSUMER_REVISION^{commit}"
      - name: Check out consumer revision
        env:
          CONSUMER_REVISION: ${{ steps.deployment-inputs.outputs.consumer_revision }}
        run: git checkout --detach "$CONSUMER_REVISION"
      - name: Validate deployment tooling
        run: |
          for path in scripts/check-production-adoption.mjs scripts/create-deployment-manifest.mjs scripts/smoke-pages.mjs; do
            if [[ ! -f "$path" ]]; then
              echo "consumer_revision lacks required deployment tooling: $path"
              exit 1
            fi
          done
          for script in check test:browser test:accessibility deployment:manifest artifact:check smoke:pages; do
            if ! grep -q "\"$script\"" package.json; then
              echo "consumer_revision lacks required npm script: $script"
              exit 1
            fi
          done
          if [[ "${{ steps.deployment-inputs.outputs.deployment_mode }}" == "adopt" ]] && ! grep -q "SNOREDEX_CURRENT_DEPLOYMENT_PATH" scripts/check-production-adoption.mjs; then
            echo "consumer_revision lacks the published deployment adoption guard"
            exit 1
          fi
          if [[ "${{ steps.deployment-inputs.outputs.deployment_mode }}" == "rollback" ]] && ! grep -q "SNOREDEX_CURRENT_DEPLOYMENT_PATH" scripts/create-deployment-manifest.mjs; then
            echo "consumer_revision lacks recoverable deployment provenance"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install supported Playwright engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run repository gates
        run: npm run check
      - name: Read current production catalogue fingerprint
        id: current-production
        env:
          SNOREDEX_PAGE_URL: https://m4s-ai.github.io/snoredex-checklist/
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/current-deployment.json"
          rm -f "$manifest"
          status="$(curl --silent --show-error --location --output "$manifest" --write-out '%{http_code}' "$SNOREDEX_PAGE_URL/deployment.json")"
          if [[ "$status" == "404" ]]; then
            echo "catalogue_fingerprint=" >> "$GITHUB_OUTPUT"
            echo "app_revision=" >> "$GITHUB_OUTPUT"
            echo "manifest_path=" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "200" ]]; then
            fingerprint="$(node --input-type=module -e 'import fs from "node:fs"; const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).catalogueFingerprint; if (!/^sha256:[0-9a-f]{64}$/.test(value ?? "")) process.exit(1); process.stdout.write(value);' "$manifest")"
            app_revision="$(node --input-type=module -e 'import fs from "node:fs"; const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).appRevision; if (!/^[0-9a-f]{40}$/.test(value ?? "")) process.exit(1); process.stdout.write(value);' "$manifest")"
            echo "catalogue_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
            echo "app_revision=$app_revision" >> "$GITHUB_OUTPUT"
            echo "manifest_path=$manifest" >> "$GITHUB_OUTPUT"
          else
            echo "current production deployment manifest unavailable (HTTP $status)"
            exit 1
          fi
      - name: Validate rollback target
        if: steps.deployment-inputs.outputs.deployment_mode == 'rollback'
        env:
          CONSUMER_REVISION: ${{ steps.deployment-inputs.outputs.consumer_revision }}
          CURRENT_DEPLOYMENT_PATH: ${{ steps.current-production.outputs.manifest_path }}
        run: |
          set -euo pipefail
          if [[ -z "$CURRENT_DEPLOYMENT_PATH" ]]; then
            echo "rollback requires an existing published deployment manifest"
            exit 1
          fi
          node --input-type=module - "$CURRENT_DEPLOYMENT_PATH" "$CONSUMER_REVISION" <<'NODE'
          import fs from 'node:fs';

          const [manifestPath, targetRevision] = process.argv.slice(2);
          const current = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const lock = JSON.parse(fs.readFileSync('catalogue.lock.json', 'utf8'));
          const commit = /^[0-9a-f]{40}$/u;
          const digest = /^sha256:[0-9a-f]{64}$/u;
          const previous = current?.rollback;
          const sources = current?.sourceFingerprints;
          const sameCatalogueDeployment = current?.catalogueFingerprint === previous?.catalogueFingerprint;
          const validLength = (value) => Number.isSafeInteger(value) && value > 0;
          if (
            current?.schema !== 'snoredex-checklist-deployment' ||
            current?.schemaVersion !== '1.0.0' ||
            current?.pageUrl !== 'https://m4s-ai.github.io/snoredex-checklist/' ||
            !previous ||
            previous.appRevision !== targetRevision ||
            !commit.test(targetRevision) ||
            !commit.test(previous.producerRevision) ||
            previous.producerRevision !== lock.producerRevision ||
            previous.contractVersion !== lock.contractVersion ||
            previous.catalogueFingerprint !== lock.catalogueFingerprint ||
            previous.catalogueByteSha256 !== lock.catalogueByteSha256 ||
            previous.catalogueByteLength !== lock.catalogueByteLength ||
            !digest.test(current.catalogueFingerprint ?? '') ||
            !digest.test(previous.catalogueFingerprint ?? '') ||
            !digest.test(previous.catalogueByteSha256 ?? '') ||
            !validLength(previous.catalogueByteLength) ||
            !Array.isArray(sources) ||
            sources.length === 0 ||
            sources.some((value) => !digest.test(value)) ||
            new Set(sources).size !== sources.length ||
            !sameCatalogueDeployment
          ) {
            throw new Error('rollback target must match the exact published recovery tuple');
          }
          NODE
      - name: Require reviewed producer migration target
        if: steps.deployment-inputs.outputs.deployment_mode == 'adopt'
        env:
          SNOREDEX_DEPLOYMENT_MODE: ${{ steps.deployment-inputs.outputs.deployment_mode }}
          SNOREDEX_CURRENT_DEPLOYMENT_PATH: ${{ steps.current-production.outputs.manifest_path }}
        run: node scripts/check-production-adoption.mjs
      - name: Run browser and accessibility gates
        run: |
          npm run test:browser
          npm run test:accessibility
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Add deployment provenance
        env:
          SNOREDEX_PAGE_URL: https://m4s-ai.github.io/snoredex-checklist/
          SNOREDEX_CURRENT_DEPLOYMENT_PATH: ${{ steps.current-production.outputs.manifest_path }}
        run: npm run deployment:manifest
      - name: Recheck published artifact
        run: npm run artifact:check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed Pages site
        env:
          SNOREDEX_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SNOREDEX_EXPECTED_GITHUB_SHA: ${{ steps.deployment-inputs.outputs.consumer_revision }}
        run: |
          export SNOREDEX_EXPECTED_PRODUCER_REVISION="$(node --input-type=module -e "import fs from 'node:fs'; process.stdout.write(JSON.parse(fs.readFileSync('catalogue.lock.json', 'utf8')).producerRevision)")"
          export SNOREDEX_EXPECTED_CONTRACT_VERSION="$(node --input-type=module -e "import fs from 'node:fs'; process.stdout.write(JSON.parse(fs.readFileSync('catalogue.lock.json', 'utf8')).contractVersion)")"
          export SNOREDEX_EXPECTED_CATALOGUE_FINGERPRINT="$(node --input-type=module -e "import fs from 'node:fs'; process.stdout.write(JSON.parse(fs.readFileSync('catalogue.lock.json', 'utf8')).catalogueFingerprint)")"
          export SNOREDEX_EXPECTED_CATALOGUE_BYTE_SHA256="$(node --input-type=module -e "import fs from 'node:fs'; process.stdout.write(JSON.parse(fs.readFileSync('catalogue.lock.json', 'utf8')).catalogueByteSha256)")"
          export SNOREDEX_EXPECTED_CATALOGUE_BYTE_LENGTH="$(node --input-type=module -e "import fs from 'node:fs'; process.stdout.write(String(JSON.parse(fs.readFileSync('catalogue.lock.json', 'utf8')).catalogueByteLength))")"
          npm run smoke:pages
