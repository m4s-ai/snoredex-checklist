name: Release catalogue update

on:
  workflow_call:
    outputs:
      result:
        description: Catalogue intake outcome
        value: ${{ jobs.release.outputs.result }}
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: catalogue-release
  cancel-in-progress: false

jobs:
  release:
    name: release current producer catalogue
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.outcome.outputs.result }}
    env:
      CHECKLIST_ISSUE: https://github.com/m4s-ai/snoredex-checklist/issues/29
      PRODUCER_ISSUE: https://github.com/m4s-ai/snoredex-data/issues/332
      PRODUCER_REPOSITORY: m4s-ai/snoredex-data
    steps:
      - name: Check out Checklist main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve checked producer main
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          producer_revision="$(gh api "repos/${PRODUCER_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ ! "$producer_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CATALOGUE_RELEASE_PRODUCER_REVISION_INVALID"
            exit 1
          fi
          gate_conclusion="$(gh api "repos/${PRODUCER_REPOSITORY}/actions/workflows/release-gate.yml/runs?branch=main&event=push&per_page=100" --jq "[.workflow_runs[] | select(.head_sha == \"${producer_revision}\")][0].conclusion // \"\"")"
          if [[ "$gate_conclusion" != "success" ]]; then
            echo "CATALOGUE_RELEASE_PRODUCER_GATE_MISSING"
            exit 1
          fi
          echo "revision=$producer_revision" >> "$GITHUB_OUTPUT"

      - name: Download exact producer assets
        env:
          PRODUCER_REVISION: ${{ steps.producer.outputs.revision }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/catalogue-release"
          mkdir -p "$candidate"
          for filename in collector_catalogue.json collector_catalogue.schema.json collector_migrations.json collector_catalogue.fixture.json; do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              "https://raw.githubusercontent.com/${PRODUCER_REPOSITORY}/${PRODUCER_REVISION}/${filename}" \
              --output "${candidate}/${filename}"
          done

      - name: Read previous Checklist catalogue release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --limit 100 --json tagName,createdAt --jq 'map(select(.tagName | startswith("catalogue-"))) | sort_by(.createdAt) | reverse | .[0].tagName // ""')"
          if [[ -n "$previous_tag" ]]; then
            mkdir -p "$RUNNER_TEMP/previous-catalogue-release"
            gh release download "$previous_tag" --pattern catalogue-release.json --dir "$RUNNER_TEMP/previous-catalogue-release"
            echo "manifest=$RUNNER_TEMP/previous-catalogue-release/catalogue-release.json" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and compare candidate
        id: candidate
        env:
          PREVIOUS_MANIFEST: ${{ steps.previous.outputs.manifest }}
          PRODUCER_REVISION: ${{ steps.producer.outputs.revision }}
        run: |
          set -euo pipefail
          previous_args=()
          if [[ -n "$PREVIOUS_MANIFEST" ]]; then
            previous_args=(--previous-release "$PREVIOUS_MANIFEST")
          fi
          npm run release:catalogue -- \
            --candidate-dir "$RUNNER_TEMP/catalogue-release" \
            --producer-revision "$PRODUCER_REVISION" \
            --issue-url "$CHECKLIST_ISSUE" \
            --issue-url "$PRODUCER_ISSUE" \
            "${previous_args[@]}"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/catalogue-release/catalogue-release.json`, 'utf8'));
          for (const [name, value] of Object.entries({
            change_status: manifest.changeStatus,
            adoption_status: manifest.adoptionStatus,
            fingerprint: manifest.catalogueFingerprint,
            catalogue_sha: manifest.assets['collector_catalogue.json'].sha256,
            migration_sha: manifest.assets['collector_migrations.json'].sha256,
            contract_version: manifest.contractVersion,
          })) appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          NODE

      - name: Validate adoption and stage committed pair
        id: adoption
        if: steps.candidate.outputs.adoption_status == 'needed'
        env:
          CATALOGUE_SHA: ${{ steps.candidate.outputs.catalogue_sha }}
          CONTRACT_VERSION: ${{ steps.candidate.outputs.contract_version }}
          FINGERPRINT: ${{ steps.candidate.outputs.fingerprint }}
          MIGRATION_SHA: ${{ steps.candidate.outputs.migration_sha }}
          PRODUCER_REVISION: ${{ steps.producer.outputs.revision }}
        run: |
          set -euo pipefail
          old_fingerprint="$(node --input-type=module -e "import fs from 'node:fs'; process.stdout.write(JSON.parse(fs.readFileSync('catalogue.lock.json', 'utf8')).catalogueFingerprint)")"
          set +e
          npm run sync:catalogue -- \
            --artifact-url "https://raw.githubusercontent.com/${PRODUCER_REPOSITORY}/${PRODUCER_REVISION}/collector_catalogue.json" \
            --artifact-commit "$PRODUCER_REVISION" \
            --contract-version "$CONTRACT_VERSION" \
            --fingerprint "$FINGERPRINT" \
            --byte-sha256 "$CATALOGUE_SHA" \
            --migration-artifact-url "https://raw.githubusercontent.com/${PRODUCER_REPOSITORY}/${PRODUCER_REVISION}/collector_migrations.json" \
            --migration-byte-sha256 "$MIGRATION_SHA" \
            --issue-url "$CHECKLIST_ISSUE" \
            --issue-url "$PRODUCER_ISSUE"
          sync_status=$?
          if [[ "$sync_status" -eq 0 ]]; then
            SNOREDEX_CURRENT_CATALOGUE_FINGERPRINT="$old_fingerprint" node scripts/check-production-adoption.mjs
            adoption_status=$?
            block_code="CATALOGUE_UPDATE_BLOCKED_MIGRATION"
          else
            adoption_status=$sync_status
            block_code="CATALOGUE_UPDATE_BLOCKED_CONSUMER_CONTRACT"
          fi
          if [[ "$adoption_status" -eq 0 ]]; then
            npm run check
            adoption_status=$?
            block_code="CATALOGUE_UPDATE_BLOCKED_REPOSITORY_GATES"
          fi
          set -e
          if [[ "$adoption_status" -eq 0 ]]; then
            echo "status=ready" >> "$GITHUB_OUTPUT"
            echo "code=CATALOGUE_UPDATE_READY" >> "$GITHUB_OUTPUT"
          else
            git restore -- catalogue.lock.json vendor/snoredex-data/collector_catalogue.json vendor/snoredex-data/collector_migrations.json
            echo "status=blocked" >> "$GITHUB_OUTPUT"
            echo "code=$block_code" >> "$GITHUB_OUTPUT"
          fi

      - name: Seal release manifest
        id: sealed
        env:
          CHECK_STATUS: ${{ steps.adoption.outputs.status }}
          CHECK_CODE: ${{ steps.adoption.outputs.code }}
          PREVIOUS_MANIFEST: ${{ steps.previous.outputs.manifest }}
          PRODUCER_REVISION: ${{ steps.producer.outputs.revision }}
        run: |
          set -euo pipefail
          compatibility_status="${CHECK_STATUS:-ready}"
          compatibility_code="${CHECK_CODE:-CATALOGUE_UPDATE_CURRENT}"
          previous_args=()
          if [[ -n "$PREVIOUS_MANIFEST" ]]; then
            previous_args=(--previous-release "$PREVIOUS_MANIFEST")
          fi
          npm run release:catalogue -- \
            --candidate-dir "$RUNNER_TEMP/catalogue-release" \
            --producer-revision "$PRODUCER_REVISION" \
            --compatibility-status "$compatibility_status" \
            --compatibility-code "$compatibility_code" \
            --issue-url "$CHECKLIST_ISSUE" \
            --issue-url "$PRODUCER_ISSUE" \
            "${previous_args[@]}"
          echo "status=$compatibility_status" >> "$GITHUB_OUTPUT"
          echo "code=$compatibility_code" >> "$GITHUB_OUTPUT"

      - name: Publish changed catalogue release
        if: steps.candidate.outputs.change_status == 'changed'
        env:
          COMPATIBILITY_CODE: ${{ steps.sealed.outputs.code }}
          COMPATIBILITY_STATUS: ${{ steps.sealed.outputs.status }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_REVISION: ${{ steps.producer.outputs.revision }}
        run: |
          set -euo pipefail
          tag="catalogue-${PRODUCER_REVISION}"
          release_args=(create "$tag" --target "${GITHUB_SHA}" --title "Catalogue ${PRODUCER_REVISION:0:12}" --notes "Producer ${PRODUCER_REVISION}; ${COMPATIBILITY_CODE}. See ${CHECKLIST_ISSUE}.")
          if [[ "$COMPATIBILITY_STATUS" == "blocked" ]]; then
            release_args+=(--prerelease)
          fi
          gh release "${release_args[@]}" \
            "$RUNNER_TEMP/catalogue-release/collector_catalogue.json" \
            "$RUNNER_TEMP/catalogue-release/collector_catalogue.schema.json" \
            "$RUNNER_TEMP/catalogue-release/collector_migrations.json" \
            "$RUNNER_TEMP/catalogue-release/collector_catalogue.fixture.json" \
            "$RUNNER_TEMP/catalogue-release/catalogue-release.json"

      - name: Create or reuse compatible update pull request
        id: pull-request
        if: steps.candidate.outputs.adoption_status == 'needed' && steps.sealed.outputs.status == 'ready'
        env:
          FINGERPRINT: ${{ steps.candidate.outputs.fingerprint }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_REVISION: ${{ steps.producer.outputs.revision }}
        run: |
          set -euo pipefail
          branch="codex/catalogue-${PRODUCER_REVISION}"
          existing_pr="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // ""')"
          if [[ -z "$existing_pr" ]]; then
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch origin "$branch:refs/remotes/origin/$branch"
              if ! git diff --quiet "origin/${branch}" -- catalogue.lock.json vendor/snoredex-data/collector_catalogue.json vendor/snoredex-data/collector_migrations.json; then
                echo "CATALOGUE_UPDATE_BRANCH_CONFLICT"
                exit 1
              fi
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git switch -c "$branch"
              git add catalogue.lock.json vendor/snoredex-data/collector_catalogue.json vendor/snoredex-data/collector_migrations.json
              git diff --cached --check
              git commit -m "data: adopt producer catalogue ${PRODUCER_REVISION:0:12}"
              git push origin "$branch"
            fi
            set +e
            existing_pr="$(gh pr create --base main --head "$branch" --title "[P4] Adopt catalogue ${PRODUCER_REVISION:0:12}" --body "Issue-backed catalogue update for #29 from m4s-ai/snoredex-data@${PRODUCER_REVISION}. Source bytes and compatibility evidence are published in the catalogue release; this PR does not close #29 before deploy and rollback verification." 2>/dev/null)"
            pr_status=$?
            set -e
            if [[ "$pr_status" -ne 0 ]]; then
              echo "::warning title=CATALOGUE_UPDATE_PR_PERMISSION_REQUIRED::Branch ${branch} is ready. Enable GitHub Actions pull-request creation or open the compare URL manually."
              existing_pr="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            fi
          fi
          echo "url=$existing_pr" >> "$GITHUB_OUTPUT"

      - name: Report outcome
        id: outcome
        env:
          ADOPTION_STATUS: ${{ steps.candidate.outputs.adoption_status }}
          CHANGE_STATUS: ${{ steps.candidate.outputs.change_status }}
          COMPATIBILITY_CODE: ${{ steps.sealed.outputs.code }}
          COMPATIBILITY_STATUS: ${{ steps.sealed.outputs.status }}
          FINGERPRINT: ${{ steps.candidate.outputs.fingerprint }}
          PRODUCER_REVISION: ${{ steps.producer.outputs.revision }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          set -euo pipefail
          result="${CHANGE_STATUS}-${COMPATIBILITY_STATUS}"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            echo "## Catalogue intake"
            echo
            echo "- Producer revision: \`${PRODUCER_REVISION}\`"
            echo "- Fingerprint: \`${FINGERPRINT}\`"
            echo "- Release change: \`${CHANGE_STATUS}\`"
            echo "- Adoption: \`${ADOPTION_STATUS}\`"
            echo "- Compatibility: \`${COMPATIBILITY_CODE}\`"
            if [[ -n "$PULL_REQUEST_URL" ]]; then echo "- Update PR: ${PULL_REQUEST_URL}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$COMPATIBILITY_STATUS" == "blocked" ]]; then
            echo "::warning title=${COMPATIBILITY_CODE}::Producer bytes were released as a prerelease, but the committed catalogue and deployment remain unchanged."
          fi
